---
services:
  ansible-tower-agent:
    # image: docker.io/knucklessg1/ansible-tower-mcp:latest
    build:
      context: .
      dockerfile: debug.Dockerfile
    container_name: ansible-tower-agent
    hostname: ansible-tower-agent
    command: [ "ansible-tower-agent" ]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ansible-tower-mcp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
    env_file:
      - .env
    environment:
      - "PYTHONUNBUFFERED=1"
      - "HOST=0.0.0.0"
      - "PORT=9444"
      - "TRANSPORT=stdio"
      - "ANSIBLE_BASE_URL=${ANSIBLE_BASE_URL}"
      - "ANSIBLE_USERNAME=${ANSIBLE_USERNAME}"
      - "ANSIBLE_PASSWORD=${ANSIBLE_PASSWORD}"
      - "ANSIBLE_VERIFY=${ANSIBLE_VERIFY:-True}"
      - "PROVIDER=openai"
      - "LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:1234/v1}"
      - "LLM_API_KEY=${LLM_API_KEY:-llama}"
      - "MODEL_ID=${MODEL_ID:-qwen/qwen3.5-35b-a3b}"
      - "DEBUG=False"
      - "ENABLE_WEB_UI=True"
      - "ENABLE_OTEL=True"
    ports:
      - "9444:9444"
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9444/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
