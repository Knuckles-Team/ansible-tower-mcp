---
services:
  ansible-tower-mcp:
    # image: docker.io/knucklessg1/ansible-tower-mcp:latest
    build:
      context: .
      dockerfile: debug.Dockerfile
    container_name: ansible-tower-mcp
    hostname: ansible-tower-mcp
    command: [ "ansible-tower-mcp" ]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
    environment:
      - "PYTHONUNBUFFERED=1"
      - "HOST=0.0.0.0"
      - "PORT=8012"
      - "TRANSPORT=streamable-http"
      - "ANSIBLE_BASE_URL=${ANSIBLE_BASE_URL}"
      - "ANSIBLE_USERNAME=${ANSIBLE_USERNAME}"
      - "ANSIBLE_PASSWORD=${ANSIBLE_PASSWORD}"
      - "ANSIBLE_VERIFY=${ANSIBLE_VERIFY:-True}"
    ports:
      - "8012:8012"
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8012/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional - Connect to Standalone MCP Server
  ansible-tower-agent:
    # image: docker.io/knucklessg1/ansible-tower-mcp:latest
    build:
      context: .
      dockerfile: debug.Dockerfile
    container_name: ansible-tower-agent
    hostname: ansible-tower-agent
    command: [ "ansible-tower-agent" ]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ansible-tower-mcp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
    env_file:
      - .env
    environment:
      - "PYTHONUNBUFFERED=1"
      - "HOST=0.0.0.0"
      - "PORT=9012"
      - "MCP_URL=http://ansible-tower-mcp:8012/mcp"
      - "PROVIDER=openai"
      - "LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:1234/v1}"
      - "LLM_API_KEY=${LLM_API_KEY:-llama}"
      - "MODEL_ID=${MODEL_ID:-qwen/qwen3-coder-next}"
      - "DEBUG=False"
      - "ENABLE_WEB_UI=True"
      - "ENABLE_OTEL=True"
    ports:
      - "9012:9012"
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9012/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
